name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential nasm qemu-system-x86 grub-pc-bin grub-common xorriso mtools
      - run: npm ci
      - run: npm test

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix panel ci
      - run: npm --prefix panel run build
